# Run B – YOLOv8n with stronger augmentation (only the aug keys differ from A).
name: B_v8n_strong_aug
model: yolov8n.pt
epochs: 50
imgsz: 640          # dataset images are already 640x640
batch: 16
seed: 0
deterministic: true
optimizer: SGD      # fixed (not 'auto') so all runs use the same optimizer
lr0: 0.01
patience: 100       # no early stop within the budget
workers: 4
device: 0
plots: true
# Ultralytics default augmentation, written out explicitly:
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.7
fliplr: 0.5
mosaic: 1.0
mixup: 0.15
close_mosaic: 10
